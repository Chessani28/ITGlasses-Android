plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.itglasses.itglassesandroid'
    compileSdk 36

    defaultConfig {
        applicationId "com.itglasses.itglassesandroid"
        minSdk 24
        targetSdk 34
        def pairingOrigin = providers.gradleProperty("ITGLASSES_PAIRING_ORIGIN").getOrElse("")
        if (pairingOrigin && !(pairingOrigin ==~ /https:\/\/[a-z0-9.-]+(:[0-9]+)?/)) {
            throw new GradleException("ITGLASSES_PAIRING_ORIGIN must be a canonical HTTPS origin")
        }
        buildConfigField "String", "PAIRING_ORIGIN", groovy.json.JsonOutput.toJson(pairingOrigin)
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions += "wearables"
    productFlavors {
        phone {
            dimension "wearables"
            minSdk 24
        }
        meta {
            dimension "wearables"
            minSdk 29
            applicationIdSuffix ".meta"
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    def debugBackendUrl = providers.gradleProperty("ITGLASSES_DEBUG_BACKEND_URL")
        .getOrElse("http://127.0.0.1:8000")
    def productionBackendUrl = providers.gradleProperty("ITGLASSES_PRODUCTION_BACKEND_URL")
        .getOrElse("")

    buildTypes {
        debug {
            buildConfigField "String", "BACKEND_DEBUG_URL", "\"${debugBackendUrl}\""
            buildConfigField "String", "BACKEND_PRODUCTION_URL", "\"\""
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            buildConfigField "String", "BACKEND_DEBUG_URL", "\"http://127.0.0.1:8000\""
            buildConfigField "String", "BACKEND_PRODUCTION_URL", "\"${productionBackendUrl}\""
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // QR pairing: Google's code scanner (the scanning UI comes from Play Services; no camera permission here).
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    metaImplementation 'com.meta.wearable:mwdat-core:1.0.1'
    testImplementation 'junit:junit:4.13.2'
}

// The debug network security config is generated from ITGLASSES_PAIRING_ORIGIN, so no LAN address is versioned
// (template: app/src/debug/network_security_config.template.xml). The pilot CA is trusted only for that host.
def networkSecurityRes = layout.buildDirectory.dir("generated/network-security/res").get().asFile
def generateNetworkSecurity = tasks.register("generateDebugNetworkSecurityConfig") {
    def origin = providers.gradleProperty("ITGLASSES_PAIRING_ORIGIN").getOrElse("")
    def template = file("src/debug/network_security_config.template.xml")
    def output = new File(networkSecurityRes, "xml/network_security_config.xml")
    inputs.property("origin", origin)
    inputs.file(template)
    outputs.file(output)
    doLast {
        def host = origin ? new URI(origin).host : ""
        def pilot = host ? """<domain-config cleartextTrafficPermitted="false">
        <domain includeSubdomains="false">${host}</domain>
        <trust-anchors>
            <certificates src="@raw/itglasses_pilot_ca" />
        </trust-anchors>
    </domain-config>""" : "<!-- ITGLASSES_PAIRING_ORIGIN not set: no pilot CA -->"
        output.parentFile.mkdirs()
        output.setText(template.getText("UTF-8").replace("<!-- @PAIRING_DOMAIN_CONFIG@ -->", pilot), "UTF-8")
    }
}
android.sourceSets.debug.res.srcDir(networkSecurityRes)
tasks.named("preBuild") { dependsOn generateNetworkSecurity }
