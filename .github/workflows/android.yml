name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Pruebas y APK (phone debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Verifica que gradle-wrapper.jar sea el oficial de Gradle.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Solo el sabor "phone": el sabor "meta" necesita el SDK de Meta Wearables,
      # que no está en los repositorios públicos configurados.
      - name: Pruebas unitarias
        run: ./gradlew --no-daemon testPhoneDebugUnitTest

      - name: Compilar APK
        run: ./gradlew --no-daemon assemblePhoneDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: itglasses-phone-debug
          path: app/build/outputs/apk/phone/debug/*.apk
          retention-days: 14

      - name: Subir reporte de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: app/build/reports/tests/
          retention-days: 7
